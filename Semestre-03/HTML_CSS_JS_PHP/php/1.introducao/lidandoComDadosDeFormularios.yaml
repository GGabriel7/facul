Contextualização da Situação:
    - Aplicação simples, envolvendo o ciclo Requisição e Resposta.
    - Formulário HTML (Login e E-mail) para coleta de dados do usuário.
    - insere os dados e acionando enter, os dados serão enviados ao servidor.
    - O servidor processa os dados e retorna uma resposta ao cliente.

Código HTML:
    <html>
        <body>

            <form action="welcome.php" method="POST">
                Name: <input type="text" name="name"><br>
                E-mail: <input type="text" name="email"><br>
                <input type="submit">
            </form>

        </body>
    </html>

Código PHP (welcome.php):
    <html>
    <body>

    Welcome <?php echo $_POST["name"]; ?><br>
    Your email address is: <?php echo $_POST["email"]; ?>

    </body>
    </html>

    Esse código PHP recupera os dados enviados pelo formulário HTML usando o método POST e exibe uma mensagem de boas-vindas com o nome e o e-mail fornecidos pelo usuário.

    