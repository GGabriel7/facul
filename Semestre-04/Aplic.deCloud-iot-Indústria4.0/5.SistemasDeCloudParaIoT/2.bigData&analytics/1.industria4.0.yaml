Industria 4.0:
  - A 4° revolução industrial, iniciada no inicio do século XXI, caracterizada pela integração de tecnologias digitais, como inteligência artificial, IoT, big data e automação, para criar fábricas inteligentes e processos de produção mais eficientes.

  - Big data: Com a quantidade de dados gerados pelas máquinas e sensores, o big data se torna essencial para analisar e interpretar essas informações, permitindo a tomada de decisões mais informadas e a otimização dos processos de produção.

  - Analytics: A análise de dados é fundamental para a indústria 4.0, pois permite identificar padrões, tendências e insights que podem ser usados para melhorar a eficiência, reduzir custos e aumentar a produtividade.

  
  - Bigdata oferece uma grande quantidade de dados que podem ser usados para ANALISAR e interpretar informações, permitindo a tomada de decisões mais informadas e a otimização dos processos de produção.