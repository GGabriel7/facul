Big data:
  - Com a quantidade de dados gerados pelas máquinas e sensores, o big data se torna essencial para analisar e interpretar essas informações, permitindo a tomada de decisões mais informadas e a otimização dos processos de produção.

  - NoSql: É um tipo de banco de dados que são utilizados para armazenar grandes volumes de dados não estruturados, como os gerados por sensores e máquinas na indústria 4.0. Eles são projetados para serem escaláveis e flexíveis, permitindo a rápida ingestão e consulta de dados.


  - Bigdata oferece uma grande quantidade de dados que podem ser usados para ANALISAR e interpretar informações, permitindo a tomada de decisões mais informadas e a otimização dos processos de produção.