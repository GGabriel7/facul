Realidade Aumentada:
  - Definição: A realidade aumentada (RA) é uma tecnologia que sobrepõe elementos virtuais ao mundo real, proporcionando uma experiência interativa e imervisa.

  - Exemplos: 
    - Jogos como Pokémon GO, que permite capturar criaturas virtuais no ambiente real.
    - Aplicativos de design de interiores, que permitem visualizar móveis em um espaço real antes de comprá-los.
    - Óculos virtuais que exibem informações no ambiente real, com auxílio de sensores e câmeras.

Realidade Virtual: 
  - Definição: A realidade virtual (RV) é uma tecnologia que cria um ambiente completamente digital, imersivo e interativo, podendo ser aplicada em diversas áreas, como entretenimento, educação e treinamento, tal como a RA.

  - Exemplos:
    - Jogos de realidade virtual, como Beat Saber, que permitem aos jogadores interagirem com um ambiente digital.
    - Simuladores de voo ou carro, proporcionando uma direção realista em um ambiente totalmente virtual.
    - Treinamento médico, onde os profissionais podem praticar procedimentos em um ambiente virtual antes de realizá-los em pacientes reais.

    