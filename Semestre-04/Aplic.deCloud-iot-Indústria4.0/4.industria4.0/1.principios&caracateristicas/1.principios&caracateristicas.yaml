Industria 4.0:
  - Termo utilizado para descrever a quarta revolução industrial, caracterizada pela integração de tecnologias digitais, automação e i.a na produção e manufatura. Dado inicio na década 70, com a introdução de computadores e automação na industria. 

  - Caracteristicas:
    - Integração de sistemas: Conexão e comunicação entre máquinas, dispositivos e sistemas de produção.
    - Automação: Uso de robôs e sistemas automatizados para realizar tarefas repetitivas e complexas.
    - Análise de dados: Coleta e análise de grandes volumes de dados para otimizar processos e tomar decisões informadas.
    - Personalização: Capacidade de produzir produtos personalizados em massa, atendendo às necessidades individuais dos clientes.
    - Sustentabilidade: Foco em práticas sustentáveis, reduzindo o desperdício e o impacto ambiental.

  - Prinicipios:
    - Interoperabilidade: Capacidade de diferentes sistemas e dispositivos se comunicarem e trabalharem juntos.
    - Moduralidade: Dividir o sistema em módulos independentes que podem ser facilmente substituídos ou atualizados.
    - Descentralização: Distribuição de decisões e controle para diferentes partes do sistema, como enviar dados para nuvem.
    - Sustentabilidade: Foco em práticas sustentáveis, reduzindo o desperdício e o impacto ambiental.
    - Análise de dados: Coleta e análise de grandes volumes de dados para otimizar processos e tomar decisões informadas.