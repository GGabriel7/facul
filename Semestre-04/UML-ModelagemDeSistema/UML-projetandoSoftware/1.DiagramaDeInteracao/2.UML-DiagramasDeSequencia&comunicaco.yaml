Atividades do Desenvolvimento de Software:
  - Levantamento de Requisitos
  - Análise
  - Projeto (design)
  - Implementação
  - Testes
  - Implantacação

UML (UNIFIED MODELING LANGUAGE):
  - Os diagramas da UML que, usualmente, são construídos nos modelos de análise e de projeto. Trata-se de uma visão prática, uma vez que a especificação da linguagem UML não determina quais diagramas devam ser usados em quais etapas e, tampouco, em que ordem devem ser elaborados. 

Diagrama de Sequencia:
  - Documentar casos de uso.
  - Mostrar como os objetos do sistema se comunicam através de mensagens em ordem temporal.
  - Validar se todas as operações das classes foram identificadas e declaradas.
  - Validar a existência de um objeto necessário ao funcionamento do sistema.

Objetos do diagrama em UML:
  - Ator: É uma entidade externa que interage com o sistema enviando ou recebendo dados.
  - Fronteira: É uma classe ou um objeto responsável pela interface entre o sistema de informação e seus usuários, ou pela comunicação entre dois ou mais sistemas.
  - Controle: É uma classe ou um objeto usado quando os desenvolvedores optam por separar as regras de negócio, as manipulações de dados e o sequenciamento de tarefas da interface de comunicação do sistema com o usuário, seguindo um padrão de projeto conhecido como MVC (do inglês Model > View > Controller).
  - Entidades: São classes ou objetos responsáveis por armazenar e gerenciar os dados do sistema, bem como por mostrar a estrutura lógica e estática dos dados (Model no padrão MVC).


Diagrama de Comunicação: 
  - Determinar interfaces.
  - Determinar responsabilidades de classes.
  - Definir os papéis dos objetos que executam determinado fluxo de eventos.

