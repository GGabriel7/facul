Conceito:
  - Modelos são importantes elementos para a comunicação eficaz de ideias e informações entre usuários e os desenvolvedores de sistemas. Eles fornecem uma representação simplificada da realidade, permitindo que os usuários compreendam melhor como o sistema funciona e como interagir com ele.

Momentos:
  1- Levantamento de Dados:
    - Durante essa fase, modelos como diagramas de casos de uso e fluxogramas são utilizados para capturar os requisitos do sistema e as necessidades dos usuários.
  
  2- Construção de Modelos:
    - Nesta etapa, modelos visuais como diagramas de classes, diagramas de sequência e protótipos de interface são criados para representar a estrutura e o comportamento do sistema.
  
  3- Análise de Modelos:
    - Aqui, os modelos são revisados e analisados para garantir que eles atendam aos requisitos dos usuários e estejam alinhados com os objetivos do sistema.