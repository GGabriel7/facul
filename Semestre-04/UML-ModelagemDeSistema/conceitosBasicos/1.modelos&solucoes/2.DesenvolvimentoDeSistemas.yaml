Etapas de Análise e Desenvolvimento de Sistemas:
  - Levantamento de Requisitos: Coleta e documentação das necessidades e expectativas dos usuários e stakeholders.
  - Análise de Requisitos: Avaliação dos requisitos coletados para garantir clareza, consistência e viabilidade.
  - Projeto do Sistema: Definição da arquitetura, componentes e interfaces do sistema com base nos modelos criados.
  - Implementação: Codificação do sistema conforme o projeto definido.
  - Testes: Verificação e validação do sistema para garantir que atende aos requisitos especificados.
  - Implantação: Colocação do sistema em operação no ambiente real.
  
  - Manutenção: Correção de erros, melhorias e adaptações do sistema após a implantação.