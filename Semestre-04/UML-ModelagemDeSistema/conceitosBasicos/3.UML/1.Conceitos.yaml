Evolução UML:

O que é UML:
  - Linguagem padão para construção de projetos de sistema
  - Visualizção, especificação, construção e documentação de artefatos de um sistema
  - Independente do método ou processo de desenvolvimento
  - Não é método, nem metodologia, ne, processo de desenvolvimento de sistemas.
  - Oferece diagramas para representação das diversas visões do sistema.
  - Notação gráfica dominante no mundo orientado a objetos
  - Técnica popular nos circulos não orientado a objetos

  👉 Código é a construção da casa
  👉 UML é a planta da casa