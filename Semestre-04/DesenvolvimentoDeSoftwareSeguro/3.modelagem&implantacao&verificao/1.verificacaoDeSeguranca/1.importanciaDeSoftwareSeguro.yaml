Exploits:
  - Podem ser utilizado para infectar sistemas com malware, roubar dados, realizar ataque de negação de serviço, entre outros. Exploit tem relação com uma técnica específica de exploração de vulnerabilidade.

  - Malware:
    - É uma abreviação de "software malicioso" (malicious software). Código malicioso desenvolvido para explorar vulnerabilidade em sistemas de computadores, softwares, redes ou dispositivos.