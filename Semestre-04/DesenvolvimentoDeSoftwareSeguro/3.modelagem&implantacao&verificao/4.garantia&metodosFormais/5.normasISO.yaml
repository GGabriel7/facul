ISO - International Organization for Standardization: Orgão não-governamental que desenvolve e publica padrões internacionais. 

ISOs:
  - Família ISO 27000:
    - ISO/IEC 27001: Tecnologia da informação - Tec. da segurança - Sistemas de Gestão de Segurança da Informação - Requisitos; que especifica os requisitos para um SGSI e fornece uma abordagem sistematica para gerenciar informações confidenciais  da empresa para garantir sua confidencialdiade, integridade e disponibilidade.

    - ISO/IEC 27002: Tecnologia da informação - Tec. da segurança - Código de prática para controles de segurança da informação; Segurança física, de rede, controles de acesso e gerecniamento de incidentes.

    - ISO/IEC 27003: Tecnologia da informação - Tec. da segurança - Sistemas de Gestão de Segurança da Informação - orientações; Fornece diretrizes para implementação de um SGSI. Fase de planejamento, projeto e implantação.