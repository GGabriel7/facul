NIST - National Institute of Standards and Technology: Oferece uma série de publicações para dar suporte formal ao desenvolvimento seguro. Publicaram e mantém atualizadda um framework específico para segurança.

NIST CyberSecurty Framework: Consiste em padões, diretrizes e práticas que ajuddam a melhorar gerenciamento de reiscos e de segurança cibernética das organizações. 

As 5 Etapas do NIST CF: 
  1. identificar: Entedimento complento de quais os ativos e recursos mais importantes. Gerenciamento de ativos, ambiente de negocios, governaça, avaliaçção de riscos, gerenciamento de riscos e gerenciamento de riscos na cedeia de suprimentos

  2. Proteger: Controle de segurança técnica e física. Controle de acesso, treinamentos, segurança de dados, proteção de informações, manutenção...

  3. Detectar: Medidads de Alertas. Anomalias e eventos, monitoramente e processo de dectecção de vulnerabildiade...

  4. Responder: Resposta adequada a ataques. Planejamento de respostas, comunicações, analise, mitigação e melhorias.

  5. Recuperar: planos de resiliencia cibernetica e garantem a continuidade dos negocios em caso de ataques e violações.