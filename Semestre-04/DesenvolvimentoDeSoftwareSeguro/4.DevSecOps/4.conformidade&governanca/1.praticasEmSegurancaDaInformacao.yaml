Conformidade e Segurança: 
  - Conformidade: Comprimento das leis, regulamentos e padrões estabelecidos com o objetivo de garantir a segurança dos dados e informações.
  
  - Governança: Conjunto de processos, políticas, normas e diretrizes que devem ser utilizados para gerenciar e controlar a segurança da informação de uma organização.

Exemplos de mecanismos de conformidade:
  PCI DSS: Padrão de segurança de dados do setor de cartões de pagamento. Ele define os requisitos de segurança que as empresas devem seguir ao processar, armazenar ou transmitir dados de cartão de pagamento.

  SOC 2: Define as práticas recomendadas de segurança da informação para empresas que proveem serviços de computação em nuvem para outras empresas.

Principais mecanismos de governança:
  Gerenciamento de riscos: Identificação, avaliação e tratamento dos riscos que podem afetar a empresa, levando-se em consideração fatores, como: probabilidade, impacto, vulnerabilidade e ameaças.

  Controle internos: Implementação de controles internos para garantir a integridade das operações, prevenção de fraudes e erros, proteção de ativos e cumprimento de regulamentações.

  