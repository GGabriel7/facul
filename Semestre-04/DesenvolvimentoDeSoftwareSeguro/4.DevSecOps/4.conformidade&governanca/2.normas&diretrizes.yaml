Regulamento e Padrões de Segurança: São documentos estabelecidos por governos e organizações com o objetivo de definir requisitos e diretrizes de segurança que as empresas devem seguir, fornecendo um conjunto de regras, normas técnicas e práticas recomendadas para garantir que as empresas implementem medidas de segurança adequadas para proteger operações, sistemas e dados.

principais normas e regulações:
  ISO 27001: Norma que define os requisitos para estabelecer, implementar, manter e melhorar continuamente um sistema de gestão de segurança da informação (SGSI).

  NIST SP 800-53: Norma, publicada pelo National Institute of Standards and Technology (NIST), que fornece um conjunto abrangente de controles de segurança da informação para as organizações dos EUA.

  GDPR: Regulamento Geral de Proteção de Dados da União Europeia, o qual define as regras para a proteção de dados pessoais dos cidadãos da UE.

  LGPD: Lei Geral de Proteção de Dados, lei brasileira que estabelece as regras para coleta, armazenamento, tratamento e compartilhamento dos dados pessoais de indivíduos.

  PCI DSS: Padrão de Segurança de Dados do Setor de Pagamento, que é um conjunto de requisitos de segurança para empresas que processam transações com cartões de crédito.

  HIPAA: Lei de Portabilidade e Responsabilidade do Seguro Saúde, que é um conjunto de normas de segurança da informação para a proteção de dados de saúde nos Estados Unidos.

  SOX: Lei Sarbanes-Oxley, lei federal dos EUA que estabelece requisitos para a contabilidade e a divulgação de informações financeiras.

  COBIT: Controle de Objetivos para Informação e Tecnologia Relacionada, que é um modelo de governança de TI usado para ajudar as empresas a gerenciar e proteger seus recursos de informação.

  ITIL: Biblioteca de Infraestrutura de Tecnologia da Informação (ITIL) é um conjunto de práticas recomendadas para a gestão de serviços de TI.

   ISO 22301: Norma que define os requisitos para um Sistema de Gestão de Continuidade de Negócios (SGCN) para ajudar as empresas a se prepararem para lidar com interrupções e manter as operações em caso de desastres.

   ISO 27002: Estabelece um conjunto de controles de segurança da informação que podem ser implementados por organizações de qualquer porte ou setor.

   ISO 27017: Fornece diretrizes específicas para a segurança da informação em nuvem.

   ISO 27018: Estabelece um conjunto de diretrizes para proteção de informações pessoais em ambientes de computação em nuvem pública.

   ISO 27701: Trata dos requisitos e orientações para um sistema de gestão de privacidade da informação (SGPI).

   ISO 22301: Estabelece requisitos para um sistema de gestão de continuidade de negócios (SGCN).

   ISO 20000: Estabelece requisitos para um sistema de gestão de serviços de TI (SGSTI).

   ISA/IEC 62443: Norma que é usada para proteger sistemas de controle industrial contra ameaças cibernéticas.