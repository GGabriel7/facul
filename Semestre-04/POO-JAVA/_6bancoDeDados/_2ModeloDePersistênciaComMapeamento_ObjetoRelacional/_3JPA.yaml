JPA - Java Persistence API:
  - JPA é uma especificação da plataforma Java que define uma API para gerenciamento de persistência de dados em aplicações Java. Ela fornece uma maneira de mapear objetos Java para tabelas em um banco de dados relacional, permitindo que os desenvolvedores trabalhem com dados usando objetos Java em vez de escrever SQL diretamente. JPA é parte do Java EE (Enterprise Edition) e é amplamente utilizado em aplicações empresariais para facilitar o acesso a bancos de dados e a manipulação de dados persistentes. Ele suporta operações CRUD (Create, Read, Update, Delete) e oferece recursos avançados como consultas JPQL (Java Persistence Query Language) e mapeamento de relacionamentos entre entidades.

  - EntityManager:
    - O EntityManager é a interface central da JPA que é usada para interagir com o contexto de persistência. Ele é responsável por gerenciar as entidades, realizar operações de persistência, consultas e transações. O EntityManager fornece métodos para criar, ler, atualizar e excluir entidades, bem como para executar consultas JPQL. Ele também é responsável por manter o estado das entidades e garantir a consistência dos dados durante as operações de persistência.