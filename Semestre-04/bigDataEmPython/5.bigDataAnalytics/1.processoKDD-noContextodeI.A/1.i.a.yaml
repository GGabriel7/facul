Definição de I.A (Inteligência Artificial): rea de pesquisa da computação dedicada a buscar métodos ou dispositivos computacionais que possuam ou multipliquem a capacidade racional do ser humano de resolver problemas, pensar ou, de forma ampla, ser inteligente. A máquina simula o comportamento humano por meio de Processamento da Linguagem Natural, Visão Computacional ou Processamento de Imagens, Representação do Conhecimento e Raciocínio com Lógica (de predicados, modal, difusa etc.), e sistemas de agentes. Definindo esses sistemas como agentes, estes são capazes de aprender com o meio em que vivem, mediante observações feitas por intermédio de sensores e ações tomadas por atuadores, baseadas em processamentos lógicos que ocorrem graças ao aprendizado de máquina

I.A simbólica: Conhecimento representado por regras baseadas em lógica ou árvores de decisão. Problemas se transformam em fórmulas e expressões lógicas, e o raciocínio ocorre a partir de operações lógicas feitas sobre símbolos, contra axionamas e regras já conhecidas. Geralmente funciona com o sistema tendo uma BASE DE CONHECIMENTO e, dependendo da solicitação do usuário, ela se adequa e resolve esse problema com base no seu conhecimento.

I.A subsimbólica ou conexionista: O conhecimento é representado a partir de modelos de sistemas classificadores ou redes neurais. A necessidade da IA subsimbólica ou conexionista surgiu da decepção com a IA simbólica, que não conseguia lidar bem com processamentos robustos e flexíveis, além do fato de ocultar o processamento de raciocínio de usuários não autorizados.