Obtenção do Conjunto de Dados:
  - A coleta de dados é o processo de captura e medição de informações e variáveis de interesse, de forma sistemática que permita responder a perguntas de pesquisa, bem como testar hipóteses e avaliar resultados.

  - Dados qualitativos: Dados não numéricos, normalmente descritivos ou nominais. Normalmente estão em forma de texto, sentenças ou rótulos. Coletados em grupos de foco, de discussão e entrevistas... São um bom jeito de mapear o funcionamento de um sistema ou a razão de um fenômeno, mas são custosos e levam muito tempo.

  - Dados quantitativos: São os dados numéricos, que podem ser matematicamente computados. Medem escalas  nominais, ordinais, intervalares e proporcionais. Esses dados resultam da medição de algum aspecto ou fenômeno. Entre os métodos dessa categoria, temos os surveys, as queries, o consumo de relatórios e os escavadores (scrapers).

  - =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-

  - Dados primários: São aqueles coletados de primeira mão, ou seja, dados que ainda não foram publicados, autênticos ou inéditos. Entre as fontes de dados primários, temos surveys, experimentos, questionários e entrevistas. São dados puros, coletados para a resolução de um problema específico e, se necessário, podem ser coletados novamente a qualquer momento para aumentar a quantidade.

  - Dados secundários: São aqueles dados que já foram publicados de alguma forma, ou seja, sofreram alguma interferência humana. Por exemplo, ao fazermo s a revisão de literatura em qualquer estudo, estamos revisando dados secundários. Entre as fontes de dados secundários, temos: livros, registros, biografias, jornais, censos, arquivos de dados etc. A vantagem é a economia de tempo em não ter que desenvolver um sistema de coleta, menor custo e delegação de responsabilidade.