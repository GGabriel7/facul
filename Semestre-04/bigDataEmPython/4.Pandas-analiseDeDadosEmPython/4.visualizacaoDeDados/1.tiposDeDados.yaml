Big Data: temos dados os mais variados possíveis, que isoladamente podem não significar muito, mas com o devido processamento, podemos extrair informação útil e conhecimento para tomada de decisões.

Dados Numéricos: São aqueles cujos valores são em números reais, racionais ou naturais, que expressam quantidades, proporções, valores monetários, métricas. Esses números são tipicamente passíveis de operações e cálculos matemáticos. 

Dados Categóricos: São aqueles normalmente expressos por texto, que representam rótulos, símbolos, nomes, identificadores. 

Dados Temporais: São aqueles que passam a ideia de série, cronologia, fluxo de tempo. Exemplos de dados temporais são aqueles associados a datas, aos dias da semana, índices ordinais, séculos, meses, anos, horas etc.

